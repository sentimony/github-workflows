name: skl-x live install
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/auto-reviewer-shared.yaml
      - .github/workflows/skl-x-live.yml
      - tests/test_skl_x_live.py
permissions:
  contents: read
jobs:
  live-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install cr-request with the real skl-x
        env:
          AUTO_REVIEWER_LIVE: '1'
        run: python3 -m unittest discover -s tests -p 'test_skl_x_live.py' -v
