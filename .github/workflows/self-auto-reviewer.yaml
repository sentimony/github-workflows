name: Self Auto Reviewer

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: false
      pr_number:
        description: Legacy PR number
        required: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: read
  statuses: write

jobs:
  auto_review:
    uses: sentimony/github-workflows/.github/workflows/auto-reviewer.yaml@1a0e98e59aa772bb4c0b77d2dc4d2f9c6110e04e
    with:
      required-ci-job: validate
      pr: ${{ inputs.pr || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
    secrets:
      AUTO_REVIEWER_YNGWALD: ${{ secrets.AUTO_REVIEWER_YNGWALD }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
