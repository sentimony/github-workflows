name: cr-request live install
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/shared-auto-reviewer.yaml
      - .github/workflows/cr-request-live-install.yml
      - tests/test_cr_request_live_install.py
permissions:
  contents: read
jobs:
  live-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install cr-request with the real skl-x
        env:
          AUTO_REVIEWER_LIVE: '1'
        run: python3 -m unittest discover -s tests -p 'test_cr_request_live_install.py' -v
